# Builds the qwik-material docs site (src/qwik-material-docs) and publishes it to GitHub Pages.
#
# GitHub Pages can't be enabled on this repository (a fork whose parent disables Pages for its
# forks), so the built site is pushed to the `gh-pages` branch of a separate, non-fork repository
# that serves it — by default `<owner>/qwik-material-docs`, at
# https://<owner>.github.io/qwik-material-docs/.
#
# One-time setup:
#   1. Create the public repository `<owner>/qwik-material-docs` (empty is fine).
#   2. Create a fine-grained personal access token with access to only that repository and
#      "Contents: Read and write", and save it in THIS repository as the Actions secret
#      DOCS_DEPLOY_TOKEN. Until it exists, the publish step is skipped.
#   3. After the first successful run, in the docs repository: Settings → Pages → Build and
#      deployment → Source "Deploy from a branch", branch `gh-pages`, folder `/ (root)`.
#
# Optional repository variables: DOCS_PAGES_REPO (`owner/name` of the publishing repository) and
# DOCS_BASE (the site's base path — `/` for a custom domain served from the root).
name: qwik-material docs (GitHub Pages)

on:
  push:
    branches: [qwik-port-21.2]
    paths:
      - 'src/qwik-cdk/**'
      - 'src/qwik-material/**'
      - 'src/qwik-material-examples/**'
      - 'src/qwik-material-docs/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/qwik-material-docs-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

# One publish at a time; let an in-progress one finish rather than cancelling it.
concurrency:
  group: qwik-material-docs-pages
  cancel-in-progress: false

env:
  PAGES_REPO: ${{ vars.DOCS_PAGES_REPO || format('{0}/qwik-material-docs', github.repository_owner) }}

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      DOCS_DEPLOY_TOKEN: ${{ secrets.DOCS_DEPLOY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from package.json's `packageManager` field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Only the docs site and its workspace dependencies (qwik-cdk, qwik-material,
      # qwik-material-examples) — not the rest of the monorepo.
      - name: Install
        run: pnpm install --frozen-lockfile --filter "qwik-material-docs..."
        env:
          HUSKY: '0'

      - name: Build qwik-cdk and qwik-material
        run: |
          pnpm -C src/qwik-cdk build
          pnpm -C src/qwik-material build

      # Served from https://<owner>.github.io/<publishing repo name>/ unless DOCS_BASE says otherwise.
      - name: Build the docs site
        run: |
          base="${DOCS_BASE_VAR:-/${PAGES_REPO#*/}/}"
          echo "Building with base path $base"
          DOCS_BASE="$base" pnpm -C src/qwik-material-docs build
        env:
          DOCS_BASE_VAR: ${{ vars.DOCS_BASE }}

      - name: Publish to ${{ env.PAGES_REPO }} (gh-pages)
        if: env.DOCS_DEPLOY_TOKEN != ''
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.DOCS_DEPLOY_TOKEN }}
          external_repository: ${{ env.PAGES_REPO }}
          publish_branch: gh-pages
          publish_dir: src/qwik-material-docs/dist
          # Keep the publishing branch to a single commit; history lives in this repository.
          force_orphan: true
          # Plain static files: write .nojekyll so GitHub Pages serves them as-is.
          enable_jekyll: false
          full_commit_message: 'Deploy docs from ${{ github.repository }}@${{ github.sha }}'

      - name: Publishing skipped
        if: env.DOCS_DEPLOY_TOKEN == ''
        run: echo "::notice::Built the docs site but did not publish it — add the DOCS_DEPLOY_TOKEN secret (see this workflow's header)."
